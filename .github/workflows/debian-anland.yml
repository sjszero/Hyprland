name: Build Debian Anland packages
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: debian-anland-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Aquamarine 0.14 and Hyprland 0.56.2 arm64 Debian packages
    runs-on: ubuntu-24.04-arm
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_STATSLOG: ${{ github.workspace }}/ccache.stats
      CCACHE_WRAPPER_LOG: ${{ github.workspace }}/ccache-wrapper.log
      CCACHE_MAXSIZE: 2G
      DEB_BUILD_OPTIONS: nocheck
    container:
      image: debian:forky
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # Aquamarine v0.14.0 and Hyprgrass v0.8.2 are vendored as clean source
      # baselines. build-anland.sh applies project patches only in staging.


      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates ccache cmake cpio curl debhelper-compat meson ninja-build \
            devscripts dpkg-dev fakeroot g++-16 git pkg-config pkgconf quilt sudo hwdata \
            hyprland-protocols hyprwayland-scanner hyprwire-scanner \
            libcairo-dev libdisplay-info-dev libdrm-dev libegl-dev \
            libegl1-mesa-dev libgbm-dev libgles-dev libglaze-dev \
            libhyprcursor-dev libhyprgraphics-dev libhyprlang-dev \
            libhyprutils-dev libhyprwire-dev libinput-dev liblcms2-dev libglm-dev \
            liblua5.5-dev libmuparser-dev libpango1.0-dev libpixman-1-dev \
            libpipewire-0.3-dev libspa-0.2-dev libseat-dev libeis-dev libre2-dev \
            libsdbus-c++-dev libssl-dev libtomlplusplus-dev libudev-dev libudis86-dev \
            libwayland-dev libxkbcommon-dev libxcb1-dev libxcb-render0-dev \
            libxcb-xfixes0-dev libxcb-icccm4-dev libxcb-composite0-dev \
            libxcb-res0-dev libxcb-errors-dev libxcursor-dev glslang-dev \
            glslang-tools wayland-protocols xwayland xxd

      - name: Restore compiler cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-hyprland-${{ runner.os }}-${{ runner.arch }}-forky-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-hyprland-${{ runner.os }}-${{ runner.arch }}-forky-

      - name: Configure compiler cache
        run: |
          mkdir -p "$CCACHE_DIR"
          cat > /usr/local/bin/ccache <<'EOF'
          #!/bin/sh
          unset CCACHE_DISABLE CCACHE_NOSTATS
          printf '.\n' >> "$CCACHE_WRAPPER_LOG"
          exec /usr/bin/ccache "$@"
          EOF
          chmod 0755 /usr/local/bin/ccache
          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --zero-stats
          : > "$CCACHE_STATSLOG"
          : > "$CCACHE_WRAPPER_LOG"

      - name: Prepare unprivileged builder
        run: |
          useradd --create-home --shell /bin/bash builder
          echo 'builder ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build at native full parallelism
        run: |
          su -s /bin/bash builder -c "cd '$GITHUB_WORKSPACE' && CCACHE_DIR='$CCACHE_DIR' CCACHE_COMPILERCHECK='$CCACHE_COMPILERCHECK' CCACHE_STATSLOG='$CCACHE_STATSLOG' CCACHE_WRAPPER_LOG='$CCACHE_WRAPPER_LOG' CCACHE_MAXSIZE='$CCACHE_MAXSIZE' DEB_BUILD_OPTIONS=\"$DEB_BUILD_OPTIONS parallel=$(nproc)\" ./build-anland.sh"
          ccache --show-stats --verbose
          test "$(wc -l < "$CCACHE_WRAPPER_LOG")" -gt 0

      - name: Save compiler cache
        uses: actions/cache/save@v5
        if: always()
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-hyprland-${{ runner.os }}-${{ runner.arch }}-forky-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify packages and checksums
        run: |
          host_arch=$(dpkg --print-architecture)
          test "$host_arch" = arm64
          test "$(find artifacts -maxdepth 1 -type f -name "hyprland_*_${host_arch}.deb" | wc -l)" -eq 1
          test "$(find artifacts -maxdepth 1 -type f -name "hyprland-anland-desktop_*_${host_arch}.deb" | wc -l)" -eq 1
          test "$(find artifacts -maxdepth 1 -type f -name "libaquamarine13_*_${host_arch}.deb" | wc -l)" -eq 1
          test "$(find artifacts -maxdepth 1 -type f -name "xwayland_*_${host_arch}.deb" | wc -l)" -ge 1
          hyprland_deb=$(find artifacts -maxdepth 1 -type f -name "hyprland_*_${host_arch}.deb" ! -name '*anland*')
          dpkg-deb -c "$hyprland_deb" | grep -F "/usr/lib/aarch64-linux-gnu/hyprland/plugins/libhyprgrass.so"
          test -x artifacts/install-anland-desktop.sh
          (cd artifacts && sha256sum -c SHA256SUMS)

      - name: Upload Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: anland-debian-packages-arm64
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            artifacts/hyprland_*_arm64.deb
            artifacts/hyprland-anland-desktop_*_arm64.deb
            artifacts/libaquamarine13_*_arm64.deb
            artifacts/xwayland_*_arm64.deb
            artifacts/install-anland-desktop.sh
            artifacts/SHA256SUMS