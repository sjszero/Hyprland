name: Build Debian Anland packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Aquamarine and Hyprland arm64 Debian packages
    # Native GitHub-hosted ARM64 runner.  debian:forky is multi-architecture,
    # so Docker pulls its arm64 image and dpkg-buildpackage produces arm64 .deb files.
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:forky
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          # The package build only needs the checked-out revision. Avoid fetching
          # full history on the ARM runner.
          fetch-depth: 1

      - name: Configure official DMS repository
        run: |
          install -d -m 0755 /etc/apt/keyrings
          curl --fail --location --retry 3 --output /etc/apt/keyrings/avengemedia-dms.asc \
            https://download.opensuse.org/repositories/home:/AvengeMedia:/dms/Debian_Unstable/Release.key
          cat > /etc/apt/sources.list.d/avengemedia-dms.sources <<'EOF'
          Types: deb
          URIs: https://download.opensuse.org/repositories/home:/AvengeMedia:/dms/Debian_Unstable/
          Suites: /
          Signed-By: /etc/apt/keyrings/avengemedia-dms.asc
          EOF

      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates ccache cmake cpio curl debhelper-compat \
            devscripts dpkg-dev fakeroot g++-16 git pkg-config pkgconf sudo hwdata \
            hyprland-protocols hyprwayland-scanner hyprwire-scanner \
            libcairo-dev libdisplay-info-dev libdrm-dev libegl-dev \
            libegl1-mesa-dev libgbm-dev libgles-dev libglaze-dev \
            libhyprcursor-dev libhyprgraphics-dev libhyprlang-dev \
            libhyprutils-dev libhyprwire-dev libinput-dev liblcms2-dev \
            liblua5.5-dev libmuparser-dev libpango1.0-dev libpixman-1-dev \
            libpipewire-0.3-dev libspa-0.2-dev libseat-dev libeis-dev libre2-dev \
            libsdbus-c++-dev libssl-dev libtomlplusplus-dev libudev-dev libudis86-dev \
            libwayland-dev libxkbcommon-dev libxcb1-dev libxcb-render0-dev \
            libxcb-xfixes0-dev libxcb-icccm4-dev libxcb-composite0-dev \
            libxcb-res0-dev libxcb-errors-dev libxcursor-dev glslang-dev \
            glslang-tools wayland-protocols xwayland xxd

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .cache/ccache
          key: ${{ runner.os }}-${{ runner.arch }}-forky-ccache-v2-${{ hashFiles('CMakeLists.txt', 'src/**', 'protocols/**', 'scripts/**', 'debian/**', 'aquamarine-0.12.1/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-forky-ccache-v2-
            ${{ runner.os }}-${{ runner.arch }}-forky-ccache-

      - name: Prepare unprivileged builder
        run: |
          useradd --create-home --shell /bin/bash builder
          echo 'builder ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build Aquamarine and Hyprland
        run: |
          su -s /bin/bash builder -c "cd '$GITHUB_WORKSPACE' && DEB_BUILD_OPTIONS=parallel=2 ./build-anland.sh"

      - name: Verify selected packages
        run: |
          host_arch=$(dpkg --print-architecture)
          test "$host_arch" = arm64
          test -f "artifacts/hyprland_0.55.4+ds-2_${host_arch}.deb"
          test "$(find artifacts -maxdepth 1 -type f -name "dms_*_${host_arch}.deb" | wc -l)" -eq 1
          test -f "artifacts/hyprland-anland-desktop_0.55.4+ds-2_${host_arch}.deb"
          test -f "artifacts/libaquamarine11_0.12.1-1_${host_arch}.deb"
          test "$(find artifacts -maxdepth 1 -type f -name "xwayland_*_${host_arch}.deb" | wc -l)" -ge 1
          test "$(find artifacts -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 5

      - name: Upload selected Debian packages
        uses: actions/upload-artifact@v4
        with:
          # upload-artifact already archives transport data. Upload the actual
          # packages directly so downloads contain all installable .deb files.
          name: anland-debian-packages-arm64
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            artifacts/hyprland_0.55.4+ds-2_arm64.deb
            artifacts/dms_*_arm64.deb
            artifacts/hyprland-anland-desktop_0.55.4+ds-2_arm64.deb
            artifacts/libaquamarine11_0.12.1-1_arm64.deb
            artifacts/xwayland_*_arm64.deb
            artifacts/SHA256SUMS